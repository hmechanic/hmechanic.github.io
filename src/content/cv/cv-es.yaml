    content:
      - name: "Experiencia Profesional"
        entity:
          - organization: "Orion AI"
            dates: "Marzo de 2026 - Presente"
            position: "Fundador y desarrollador full-stack"
            responsibilities:
              - "Fundé y construí de punta a punta Orion AI (orionatiende.com), un SaaS multiempresa en producción que atiende por WhatsApp con agentes de IA y convierte cada conversación en un CRM operable. Me encargué del producto, la arquitectura, el cobro y la salida al mercado."
              - "Desarrollé el backend en FastAPI y PostgreSQL y el frontend en Next.js 16 (React, TypeScript, Server Components y BFF). Incluye aislamiento de datos por empresa, workers asíncronos con outbox y reintentos idempotentes, y cerca de 1.900 pruebas automatizadas a lo largo de casi 600 commits."
              - "Diseñé el motor conversacional con LangGraph: memoria persistente, transcripción de notas de voz y herramientas para consultar conocimiento, mover el embudo y escalar a asesores humanos en Chatwoot. El contacto y el deal se registran de forma determinista antes de invocar al modelo, así el LLM solo modifica datos que ya existen."
              - "Construí un RAG sobre Qdrant para PDF, Markdown y TXT, con embeddings configurables, búsqueda aislada por agente y un worker de indexación durable. Integré además un modelo clasificador que ubica cada conversación en la etapa del embudo."
              - "Llevé la integración con Meta hasta el final: verificación del negocio, App Review aprobado para los permisos de WhatsApp Business y un flujo propio de Embedded Signup v4 con el que cada empresa conecta su número sin soporte manual."
              - "Implementé suscripciones recurrentes con Wompi (tarjeta con 3DS, renovación, retención y control de acceso por plan) y la seguridad de la plataforma: login sin contraseña (código por correo y Google), JWT, RBAC con permisos finos, cifrado de credenciales y rate limiting. Opero el sistema en Railway y en un VPS con Docker y Chatwoot autoalojado, con métricas Prometheus y alertas en Grafana."
              - "Validé el mercado en campo con llamadas a +200 negocios de turismo (70 respuestas y 30 demos) y actualmente 8 clientes pagos. Armé un pipeline de prospección sobre datos abiertos del Registro Nacional de Turismo (unas 95.000 empresas) y el catálogo de anuncios de Meta para un experimento iterativo de descubrimiento del cliente ideal."
              - "Organicé el desarrollo como un equipo de agentes de IA (Claude Code y OpenCode), con una sesión por repositorio, coordinados desde una base de conocimiento que un pipeline con LLM mantiene sincronizada con los commits."

          - organization: "SatEmis"
            dates: "Agosto de 2025 - Presente"
            position: "Ingeniero de Software e Inteligencia Artificial"
            responsibilities:
              - "Diseñé e implementé una arquitectura distribuida con NestJS, FastAPI, Docker y PostgreSQL/PostGIS para gestionar inventarios de emisiones y procesamiento geoespacial."
              - "Desarrollé un servicio de datos satelitales con Google Earth Engine y Sentinel-5P para consultar, agregar y analizar concentraciones de metano por departamento en Colombia."
              - "Construí APIs para la ingesta, procesamiento y consulta de inventarios climáticos y datos geoespaciales."
              - "Desarrollé una aplicación web con React y TypeScript que integra autenticación, mapas interactivos, visualización de emisiones e internacionalización."
              - "Integré capacidades de inteligencia artificial para consultar y contextualizar normativa climática, facilitando la interpretación de información ambiental."
              - "Contenericé y optimicé los servicios en Google Cloud Platform (GCP) para mejorar el uso de recursos de procesamiento y almacenamiento."

          - organization: "Universidad Nacional de Colombia"
            dates: "Febrero de 2024 - Julio de 2025"
            position: "Investigador y analista de sistemas energéticos"
            responsibilities:
              - "Desarrollo del modelo de referencia energético nacional de Colombia utilizando el framework VEDA de TIMES (IEA-ETSAP)."
              - "Recolección y tratamiento de datos del sistema energético colombiano por sectores económicos y regiones."
              - "Procesamiento de grandes conjuntos de datos y desarrollo de herramientas analíticas utilizando Python."
              - "Proyección de escenarios de transición energética alineados con los planes nacionales de cambio climático."
              - "Liderazgo y coordinación de equipos multidisciplinarios."
              - "Comunicación efectiva de resultados técnicos a audiencias no técnicas."

          - organization: "Universidad Nacional de Colombia"
            dates: "Abril de 2022 - Febrero de 2024"
            position: "Asistente de Investigación - Facultad de Ingeniería"
            responsibilities:
              - "Apoyo en el desarrollo de la sección de mitigación del Plan Integral de Cambio Climático (PIGCC) para empresas del sector eléctrico participantes en la Alianza del Sector Eléctrico Carbono Neutro (ASECN)."
              - "Cuantificación de huellas de carbono de Alcance 1, 2 y 3 utilizando la metodología del Protocolo GHG."
              - "Desarrollo de modelos estadísticos para proyectar emisiones basadas en variables operacionales."
              - "Evaluación de medidas de mitigación como eficiencia energética, sustitución de combustibles, cambios en la matriz energética y compensación de carbono."
              - "Realización de estudios estadísticos sobre la relación entre fenómenos climáticos y la generación de energía por fuente."
