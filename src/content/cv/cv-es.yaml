professional_profile:
    title: "Perfil Profesional"
    content: "
      Soy ingeniero mecánico y he orientado mi carrera profesional hacia dos áreas principales.

      La primera es construir productos y empresas: hacer cosas difíciles y sostener la
      resiliencia que ese proceso exige. Esto implica desarrollar tecnología, hablar con clientes
      e iterar hasta llegar a soluciones conectadas con las necesidades reales de las personas.
      Aquí desarrollo software y proyectos *AI First*, con programación de agentes, arquitecturas
      de machine learning, automatización de procesos e integración de sistemas.

      La segunda es la participación activa en investigación aplicada, especialmente en energía,
      cambio climático, análisis de datos y modelación de sistemas.

      Entre mis trabajos recientes se destacan dos proyectos: OrionAtiende.com, un SaaS de agentes
      de IA para ventas y atención al cliente por WhatsApp, y SatEmis, una plataforma de
      investigación climática que aplica machine learning a datos satelitales a escala. Orion ha
      sido mi proyecto más retador: me ha enseñado a construir un producto, venderlo, enfrentar el
      rechazo, gestionar recursos e iterar, tomando decisiones basadas en datos y no en sentimientos.

      Como consultor en ingeniería mecánica trabajo en las áreas térmica y de fluidos: energías
      renovables, modelación energética, dinámica de fluidos computacional —CFD—, mitigación del
      cambio climático, inventarios de emisiones y monitoreo remoto.

      Cuento con más de cuatro años de experiencia certificada como ingeniero líder en diseño y
      desarrollo de software, construyendo soluciones que integran datos, inteligencia artificial
      e ingeniería aplicada.

      "

