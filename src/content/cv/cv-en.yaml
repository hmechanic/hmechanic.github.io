professional_profile:
    title: "Professional Profile"
    content: "
      I am a mechanical engineer and have directed my professional career toward two main areas.

      The first is building products and companies: doing hard things and sustaining the
      resilience that process demands. That means developing technology, talking to customers,
      and iterating until the solutions connect with people's real needs. Here I develop software
      and *AI First* projects, including agent programming, machine learning architectures,
      process automation, and systems integration.

      The second is active involvement in applied research, particularly in energy, climate
      change, data analysis, and systems modeling.

      My recent work centers on two projects: OrionAtiende.com, a SaaS of AI agents for sales and
      customer service over WhatsApp, and SatEmis, a climate research platform that applies
      machine learning to satellite data at scale. Orion has been my most challenging project: it
      has taught me to build a product, sell it, face rejection, manage resources, and iterate,
      making decisions based on data rather than feelings.

      As a mechanical engineering consultant, I work in thermal and fluid systems: renewable
      energy, energy modeling, computational fluid dynamics (CFD), climate change mitigation,
      emissions inventories, and remote monitoring.

      I have nearly four years of certified experience as a lead engineer in software design and
      development, building solutions that integrate data, artificial intelligence, and applied
      engineering.

      "

