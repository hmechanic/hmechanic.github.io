professional_profile:
    title: "Professional Profile"
    content: "
    I am a mechanical engineer with more than three years of experience in software development and data analysis, specialized in building solutions based on Python and JavaScript that integrate SQL databases and web services. My background combines the modeling of energy systems with the implementation of microservice architectures, which lets me design and develop applications that meet quality standards and enable data-driven decision making.

    In my current role at SatEmis, I designed and deployed the microservice architecture using nest.js, Docker and FastAPI, optimizing the ingestion and processing of satellite data and ensuring efficient management on Google Cloud Platform. I also led the integration of SQL and NoSQL databases to support large volumes of information, improving the availability and consistency of critical data. Previously, I coordinated multidisciplinary teams in building the national energy model with the TIMES framework, developing analytical tools in Python that automated the processing of large datasets and streamlined the generation of strategic reports.
    "

